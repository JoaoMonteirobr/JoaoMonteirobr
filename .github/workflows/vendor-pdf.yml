name: Vendor PDF dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned browser libraries
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://raw.githubusercontent.com/parallax/jsPDF/v2.5.1/dist/jspdf.umd.min.js -o vendor/jspdf.umd.min.js
          curl -fL --retry 3 https://raw.githubusercontent.com/davidshimjs/qrcodejs/master/qrcode.min.js -o vendor/qrcode.min.js
          test -s vendor/jspdf.umd.min.js
          test -s vendor/qrcode.min.js
      - name: Commit vendor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/jspdf.umd.min.js vendor/qrcode.min.js
          git diff --cached --quiet || git commit -m "Vendorizar bibliotecas PDF e QR Code"
          git push
