name: Auditar divergência da produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Baixar arquivos públicos da produção
        run: |
          mkdir -p production-snapshot
          curl -fsSL --retry 3 https://gestao-alugueis-jp.vercel.app/ -o production-snapshot/index.html
          curl -fsSL --retry 3 https://gestao-alugueis-jp.vercel.app/style.css -o production-snapshot/style.css
          curl -fsSL --retry 3 https://gestao-alugueis-jp.vercel.app/app1.js -o production-snapshot/app1.js
          curl -fsSL --retry 3 https://gestao-alugueis-jp.vercel.app/app2.js -o production-snapshot/app2.js
          curl -fsSL --retry 3 https://gestao-alugueis-jp.vercel.app/app3.js -o production-snapshot/app3.js

      - name: Comparar produção com o repositório
        run: |
          : > production-drift.patch
          changed=0
          for file in index.html style.css app1.js app2.js app3.js; do
            if ! cmp -s "$file" "production-snapshot/$file"; then
              diff -u "$file" "production-snapshot/$file" >> production-drift.patch || true
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then
            echo "A produção diverge da main. Consulte o artefato production-drift."
            exit 1
          fi

      - name: Publicar relatório de divergência
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-drift
          path: production-drift.patch
          retention-days: 7
